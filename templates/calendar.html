{% extends "base.html" %}

{% block extra_head %}
<style>
    /* 日曆控制區 */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    
    /* 日曆網格 */
    .calendar-grid { 
        display: grid; 
        grid-template-columns: repeat(7, 1fr); 
        gap: 12px; 
    }
    
    .day-name { 
        text-align: center; 
        font-weight: 600; 
        color: var(--text-muted); 
        padding: 12px 0; 
        border-bottom: 2px solid var(--border-color);
    }
    
    .day-cell { 
        border: 1px solid var(--border-color); 
        border-radius: var(--radius-md); 
        min-height: 110px; 
        padding: 12px; 
        cursor: pointer; 
        transition: var(--transition); 
        background: var(--surface-color); 
        display: flex; 
        flex-direction: column; 
    }
    
    .day-cell:hover { 
        box-shadow: var(--shadow-md); 
        transform: translateY(-2px); 
        border-color: var(--primary);
    }
    
    .day-cell.empty { 
        background: transparent; 
        border: none; 
        cursor: default; 
        box-shadow: none; 
        transform: none;
    }
    
    .date-num { 
        font-weight: 600; 
        font-size: 1.1rem; 
        margin-bottom: 12px; 
        color: var(--text-main);
    }
    
    /* 狀態標示 */
    .status-indicator { 
        margin-top: auto; 
        font-size: 0.85rem; 
        font-weight: 600; 
        text-align: center; 
        padding: 6px; 
        border-radius: var(--radius-sm);
    }
    
    /* 詳細資訊區塊 */
    .details-panel { 
        margin-top: 32px; 
        padding: 24px; 
        border-radius: var(--radius-md); 
        border: 1px solid var(--border-color); 
        background: var(--surface-color); 
        box-shadow: var(--shadow-sm);
        display: none; 
    }
    
    .details-panel h3 { 
        margin-top: 0; 
        border-bottom: 1px solid var(--border-color); 
        padding-bottom: 16px; 
        margin-bottom: 16px;
        color: var(--text-main);
    }
    
    .log-list { list-style: none; padding: 0; margin: 0; }
    
    .log-item { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        padding: 16px; 
        border-bottom: 1px solid var(--border-color); 
    }
    
    .log-item:last-child { border-bottom: none; }
    .log-time { font-weight: 600; color: var(--text-main); font-size: 1.1rem;}
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">📅 歷史服藥日曆</h1>
    <p class="page-subtitle">點擊日期查看當日的詳細服藥與震顫紀錄</p>
</div>

<div class="card">
    <div class="calendar-header">
        <button class="btn btn-primary" onclick="changeMonth(-1)">&#9664; 上個月</button>
        <h2 id="currentMonthYear" style="margin: 0; font-size: 1.5rem; color: var(--text-main);">載入中...</h2>
        <button class="btn btn-primary" onclick="changeMonth(1)">下個月 &#9654;</button>
    </div>
    
    <div class="calendar-grid" id="calendarGrid">
        <!-- Days will be generated by JS -->
    </div>
</div>

<div class="details-panel" id="detailsPanel">
    <h3 id="detailsTitle">詳細紀錄</h3>
    <ul class="log-list" id="detailsList">
        <!-- Logs will be generated by JS -->
    </ul>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentDate = new Date();
    let calendarData = {};
    
    const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
    
    function changeMonth(offset) {
        currentDate.setMonth(currentDate.getMonth() + offset);
        renderCalendar();
    }
    
    async function fetchCalendarData(year, month) {
        try {
            const res = await fetch(`/api/calendar_data?year=${year}&month=${month}`);
            if (res.ok) {
                return await res.json();
            }
        } catch (e) {
            console.error("Failed to fetch calendar data", e);
        }
        return {};
    }
    
    async function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth(); // 0-indexed
        const displayMonth = month + 1;
        
        document.getElementById('currentMonthYear').textContent = `${year}年 ${monthNames[month]}`;
        
        // Fetch data for this month
        calendarData = await fetchCalendarData(year, displayMonth);
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        
        // Add day names
        const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];
        daysOfWeek.forEach(d => {
            const el = document.createElement('div');
            el.className = 'day-name';
            el.textContent = d;
            grid.appendChild(el);
        });
        
        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        // Empty cells before the first day
        for (let i = 0; i < firstDayOfMonth; i++) {
            const el = document.createElement('div');
            el.className = 'day-cell empty';
            grid.appendChild(el);
        }
        
        // Days of the month
        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(displayMonth).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const el = document.createElement('div');
            el.className = 'day-cell';
            el.onclick = () => showDetails(dateStr);
            
            const num = document.createElement('div');
            num.className = 'date-num';
            num.textContent = i;
            el.appendChild(num);
            
            if (calendarData[dateStr]) {
                const status = calendarData[dateStr].status;
                const indicator = document.createElement('div');
                
                if (status === 'abnormal') {
                    indicator.className = `status-indicator badge-abnormal`;
                    indicator.innerHTML = '⚠️ 異常';
                } else if (status === 'missed') {
                    indicator.className = `status-indicator badge-missed`;
                    indicator.innerHTML = '⏰ 漏吃';
                } else {
                    indicator.className = `status-indicator badge-normal`;
                    indicator.innerHTML = '✅ 正常';
                }
                
                el.appendChild(indicator);
            }
            
            grid.appendChild(el);
        }
        
        // Hide details panel when month changes
        document.getElementById('detailsPanel').style.display = 'none';
    }
    
    function showDetails(dateStr) {
        const panel = document.getElementById('detailsPanel');
        const title = document.getElementById('detailsTitle');
        const list = document.getElementById('detailsList');
        
        title.textContent = `${dateStr} 服藥與震顫紀錄`;
        list.innerHTML = '';
        
        const data = calendarData[dateStr];
        
        if (!data || data.records.length === 0) {
            list.innerHTML = '<li class="log-item" style="justify-content:center; color:var(--text-muted);">當日無紀錄</li>';
        } else {
            data.records.forEach(record => {
                const li = document.createElement('li');
                li.className = 'log-item';
                
                let statusTag = '';
                let tiInfo = `TI: ${record.tremor_index}`;
                
                if (record.tremor_index === -1) {
                    statusTag = '<span class="badge badge-missed">超時未服藥</span>';
                    tiInfo = '<span style="color:var(--text-muted);">TI: N/A</span>';
                } else if (record.is_abnormal === 1) {
                    statusTag = '<span class="badge badge-abnormal">震顫異常</span>';
                } else {
                    statusTag = '<span class="badge badge-normal">正常</span>';
                }
                
                let baselineInfo = record.baseline !== undefined ? ` | 基準線: ${parseFloat(record.baseline).toFixed(1)}` : '';
                
                li.innerHTML = `
                    <span class="log-time">${record.time}</span>
                    <span style="color:var(--text-muted);">${tiInfo}${baselineInfo} | 開蓋: ${record.duration_ms}ms</span>
                    ${statusTag}
                `;
                list.appendChild(li);
            });
        }
        
        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    
    // Initialize
    renderCalendar();
</script>
{% endblock %}
